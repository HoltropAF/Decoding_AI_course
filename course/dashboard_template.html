  .dcard .plate table { border-spacing: 5px 3px; }
  .dcard .well { width: 17px; height: 17px; }

  @media (min-width: 1100px) { .mods { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
  main:has(> .dash) { padding-block: 18px 24px; }
  .dhero { padding: 12px 18px; }
  .dhero .logo { width: 46px; height: 46px; }
  .dcard .actions .btn { padding: 5px 10px; font-size: 12.5px; }
  .info details { border-top: 1px solid var(--line); padding: 6px 0; }
  .info details:first-of-type { border-top: 0; }
  .info summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--teal); list-style: none; display: flex; justify-content: space-between; }
  .info summary::-webkit-details-marker { display: none; }
  .info summary::after { content: "+"; font-family: var(--font-mono); }
  .info details[open] summary::after { content: "\2212"; }
  .info details > *:not(summary) { font-size: 13.5px; margin: 8px 0 2px; }
  .info .route li { grid-template-columns: 24px 1fr; gap: 8px; }
  .info .route li::before { width: 22px; height: 22px; font-size: 11.5px; }
  .ai-line { margin: 0; font-size: 13px; padding: 8px 10px; border-left: 3px solid var(--amber); background: var(--amber-soft); border-radius: 0 8px 8px 0; }
  /* ---------- Welcome page ---------- */
  .welcome { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--teal-soft), var(--surface) 70%); border: 1px solid var(--line); border-radius: 16px; padding: clamp(22px, 4vw, 40px); display: grid; gap: 14px; }
  .welcome::after { content: ""; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, var(--well-on) 0 2px, transparent 3px) 0 0 / 22px 22px; opacity: 0.18; pointer-events: none; }
  .welcome .hello { font-size: clamp(30px, 5vw, 46px); line-height: 1.1; margin: 0; color: var(--teal); }
  .welcome .lead { font-size: clamp(16px, 1.6vw, 18.5px); margin: 0; max-width: 62ch; }
  .welcome p { margin: 0; max-width: 68ch; }
  .welcome .sign { font-style: italic; color: var(--muted); }
  .welcome .actions { margin-top: 6px; }
  .btn.big { padding: 11px 18px; font-size: 15.5px; }
  .section-title { display: grid; gap: 4px; }
  .section-title h3 { margin: 0; font-size: 21px; }
  .section-title p { margin: 0; color: var(--muted); }
  .journey { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
  .journey a { display: grid; gap: 6px; height: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  .journey a:hover, .journey a:focus-visible { border-color: var(--well-on); transform: translateY(-2px); }
  .journey .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .journey .num { font-family: var(--font-mono); font-size: 13px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); }
  .journey .done .num { background: var(--well-on); color: var(--surface); }
  .journey .time { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
  .journey strong { font-size: 16px; }
  .journey .tag { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .journey .bar { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: auto; }
  .journey .bar span { display: block; height: 100%; background: var(--well-on); }
  .journey .here { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); }
  .journey .team a { background: var(--amber-soft); }
  .promises { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .promise { padding: 16px; border-radius: 12px; background: var(--surface-2); display: grid; gap: 6px; align-content: start; }
  .promise .icon { font-size: 22px; line-height: 1; }
  .promise strong { font-size: 15.5px; }
  .promise p { margin: 0; font-size: 14px; color: var(--muted); }
  .sample.prose { padding: 4px 0 0; background: none; border: 0; }
  .sample.prose blockquote, .sample.prose details { margin: 10px 0; }
  .route { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: r; }
  .route li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; counter-increment: r; }
  .route li::before { content: counter(r); font-family: var(--font-mono); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); }
  .summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: start; }
  @media (max-width: 760px) { .summary { grid-template-columns: 1fr; } }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .stat { display: grid; gap: 2px; }
  .stat .num { font-family: var(--font-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .stat .num small { font-size: 14px; color: var(--muted); }
  .plate { display: grid; gap: 8px; }
  .plate-grid { overflow-x: auto; }
  .plate table { border-collapse: separate; border-spacing: 6px 5px; }
  .plate th { font-family: var(--font-mono); font-weight: 400; font-size: 11.5px; color: var(--muted); text-align: center; }
  .plate th a { color: var(--muted); text-decoration: none; }
  .plate th a:hover { color: var(--teal); }
  .well { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--well-on); background: transparent; cursor: pointer; padding: 0; display: block; transition: background-color 160ms ease, transform 160ms ease; }
  .well[aria-pressed="true"] { background: var(--well-on); }
  .well:hover { transform: scale(1.08); }
  .well-empty { width: 24px; height: 24px; display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #status { font-family: var(--font-mono); font-size: 12px; }
  /* ---------- Read aloud ---------- */
  .reader { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
  .reader .btn { padding: 5px 12px; font-size: 13.5px; }
  .reader select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface); font-size: 13px; max-width: 240px; }
  .reader .rlabel { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .reader .rstatus { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .reading-active :is(h1, h2, h3, h4, p, li, blockquote, table) { cursor: pointer; }
  .reading-active :is(h1, h2, h3, h4, p, li, blockquote, table):hover { background: var(--surface-2); border-radius: 3px; }
  .speaking { background: var(--amber-soft); box-shadow: 0 0 0 4px var(--amber-soft); border-radius: 3px; }
  .slide .speaking { background: transparent; box-shadow: none; text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 0.25cqw; text-underline-offset: 0.4cqw; }
  .slide.lead .speaking { text-decoration-color: #f0a464; }

  /* ---------- Section-by-section reading ---------- */
  .prose.collapsible .docsec { border-top: 1px solid var(--line); }
  .prose.collapsible .docsec.intro { border-top: 0; }
  .sechead .secicon { width: 30px; height: 22px; display: block; }
  .sechead .secicon svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .sechead { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 12px; align-items: center; cursor: pointer; padding: 14px 4px; margin: 0 -4px; border-radius: 8px; user-select: none; }
  .sechead:hover { background: var(--surface-2); }
  .sechead:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sechead .chev { font-family: var(--font-mono); color: var(--teal); width: 18px; text-align: center; transition: transform 160ms ease; }
  .docsec.open .sechead .chev { transform: rotate(90deg); }
  .prose .sechead h2 { margin: 0; padding: 0; border: 0; font-size: 20px; }
  .sechead .mins { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .secbody { padding: 0 0 18px; }
  .secbody::after { content: ""; display: block; clear: both; }
  .banner { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 8px; box-shadow: 0 6px 18px rgba(15, 40, 48, 0.07); }
  .banner .stepper { border: 0; padding: 0; }

  .banner .brow:empty { display: none; }
  .banner .reader { border: 0; padding: 0; background: none; gap: 8px; }
  .banner .secbar + .reader { margin-left: auto; }
  .banner .reader .rlabel { font-size: 12px; }
  .reader select.narrow { max-width: 190px; }
  .banner .stepper .phase { font-size: 10.5px; }
  @media (max-height: 760px) { .banner { position: static; } }
  .banner .docbar button { padding: 3px 11px; font-size: 13px; }
  .secbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .secbar .arrow { width: 30px; height: 30px; padding: 0; justify-content: center; font-size: 16px; }
  .secbar select { border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--surface); font-size: 13.5px; max-width: min(280px, 60vw); }
  .secbar .where { font-size: 13px; color: var(--muted); }
  @media (max-width: 880px) { .banner { position: static; } }
  .secnav { display: grid; gap: 1px; margin: 2px 0 6px 14px; padding-left: 8px; border-left: 2px solid var(--line); }
  .secitem { display: flex; gap: 6px; align-items: baseline; padding: 3px 6px; border-radius: 5px; font-size: 12.5px; line-height: 1.35; color: var(--muted); text-decoration: none; }
  .secitem .n { font-family: var(--font-mono); font-size: 11px; min-width: 2.4em; color: var(--muted); }
  .secitem:hover { background: var(--surface-2); color: var(--ink); }
  .secitem.read { color: var(--ink); }
  .secitem.active { background: var(--surface); color: var(--teal); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
  .secitem.active .n { color: var(--teal); }
  .secmid { display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 0 auto; }
  .toc { display: grid; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .toc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .toc-head .where { font-size: 13.5px; color: var(--muted); }
  .toc-head .where strong { color: var(--ink); }
  .toc-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .toc button.sec { font-size: 12.5px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc button.sec .n { font-family: var(--font-mono); color: var(--muted); margin-right: 5px; }
  .toc button.sec.read { background: var(--surface-2); }
  .toc button.sec[aria-current="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); font-weight: 600; }
  .toc button.sec[aria-current="true"] .n { color: var(--teal); }
  .toc .bar { height: 4px; }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--teal); cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
  .secpager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
  .secpager .where { font-size: 13px; color: var(--muted); }
  .docsec::after { content: ""; display: block; clear: both; }
  .prose .docsec > h2:first-child { border-top: 0; padding-top: 0; margin-top: 18px; }
  .prose.paged .docsec + .docsec { margin-top: 8px; }

  /* ---------- Dictionary terms in text ---------- */
  a.term { color: inherit; text-decoration: underline dotted var(--teal); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help; }
  a.term:hover, a.term:focus-visible { color: var(--teal); }
  .termtip { position: fixed; z-index: 40; max-width: min(380px, calc(100vw / var(--zoom) - 24px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(15, 40, 48, 0.18); display: grid; gap: 6px; pointer-events: none; font-size: 14px; line-height: 1.5; }
  .termtip .tt-term { font-weight: 600; font-size: 15px; color: var(--teal); }
  .termtip .tt-def code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .termtip .tt-foot { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .entry.flash { animation: flash 1.8s ease-out; }
  @keyframes flash { 0%, 30% { background: var(--amber-soft); } 100% { background: transparent; } }

  /* ---------- Dictionary ---------- */
  .dict-tools { display: grid; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); }
  .dict-search { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-size: 16px; }
  .dict-search:focus { border-color: var(--teal); }
  .letters { display: flex; flex-wrap: wrap; gap: 2px; }
  .letters button { font-family: var(--font-mono); font-size: 12.5px; width: 26px; height: 26px; border: 0; border-radius: 5px; background: transparent; cursor: pointer; color: var(--teal); }
  .letters button:hover { background: var(--teal-soft); }
  .letters button[disabled] { color: var(--line); cursor: default; background: transparent; }
  .dict-count { font-size: 13px; color: var(--muted); }
  .dict-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 10px; scroll-margin-top: 170px; align-items: start; }
  .dict-letter { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 13px; color: var(--muted); padding: 16px 0 6px; border-bottom: 1px solid var(--line); }
  .entry { display: grid; gap: 6px; align-content: start; height: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .entry:target, .entry:focus-within { border-color: var(--teal); }
  .entry .term { font-weight: 600; font-size: 16px; }
  .entry .term code, .entry .def code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .entry .def { font-size: 14.5px; line-height: 1.5; }
  .entry .ex { font-size: 13.5px; line-height: 1.5; padding: 7px 10px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--well-on); }
  .entry .ex code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .entry .ex-label, .entry .see-label { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--teal); margin-bottom: 2px; }
  .entry .see { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 13px; }
  .entry .see .see-label { display: inline; margin: 0 2px 0 0; }
  .entry .see a { color: var(--teal); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .entry .see a:hover { border-bottom-style: solid; }
  .dict-list.view-list .entry .ex { background: none; padding: 0 0 0 10px; }
  .entry .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; }
  .entry .meta a { font-family: var(--font-mono); font-size: 12px; text-decoration: none; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); }
  .entry .meta a:hover { border-color: var(--teal); }
  .entry mark { background: var(--amber-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
  .dict-empty { padding: 24px 0; color: var(--muted); }
  .dict-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
  .viewbar { display: flex; gap: 14px; align-items: center; }
  .viewopt { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .viewopt[hidden] { display: none; }
  .viewopt select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; }
  .dict-list.cols-1 .dict-group { grid-template-columns: minmax(0, 1fr); }
  .dict-list.cols-2 .dict-group { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dict-list.cols-3 .dict-group { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dict-list.cols-4 .dict-group { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .dict-list.cols-5 .dict-group { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  /* list view: entries flow down newspaper-style columns */
  .dict-list.view-list .dict-group { display: block; column-gap: 32px; column-rule: 1px solid var(--line); column-width: 360px; }
  .dict-list.view-list.cols-1 .dict-group { column-count: 1; column-width: auto; }
  .dict-list.view-list.cols-2 .dict-group { column-count: 2; column-width: auto; }
  .dict-list.view-list.cols-3 .dict-group { column-count: 3; column-width: auto; }
  .dict-list.view-list.cols-4 .dict-group { column-count: 4; column-width: auto; }
  .dict-list.view-list.cols-5 .dict-group { column-count: 5; column-width: auto; }
  .dict-list.view-list .dict-letter { column-span: all; margin-bottom: 4px; }
  .dict-list.view-list .entry { break-inside: avoid; display: grid; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 2px; height: auto; }
  @media (max-width: 700px) {
    .viewbar { display: none; }
    .dict-list .dict-group { grid-template-columns: minmax(0, 1fr) !important; column-count: 1 !important; column-width: auto !important; }
  }
  /* ---------- Dictionary: look-up view ---------- */
  .dict-toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg); padding-block: 10px; }
  .dict-toolbar .dict-search { flex: 1 1 320px; width: auto; }
  .dict-page .dlook, .dict-page .dict-list { display: none; }
  .dict-page.mode-lookup .topicopt { display: none; }
  .dict-page.mode-lookup .dlook { display: grid; }
  .dict-page:not(.mode-lookup) .dict-list { display: block; }
  .dlook { grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .dlook-side { position: sticky; top: 70px; display: grid; grid-template-rows: auto minmax(0, 1fr); border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; max-height: calc(100vh - 90px); }
  .dl-head { display: grid; gap: 8px; padding: 12px 12px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .dl-head .dict-count { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .dl-topics { display: flex; flex-wrap: wrap; gap: 5px; }
  .dl-topics button { font: inherit; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .dl-topics button:hover { border-color: var(--teal); }
  .dl-topics button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--surface); }
  .dlook-list { overflow-y: auto; padding: 6px; min-height: 0; }
  .dl-letter { position: sticky; top: -6px; z-index: 1; background: var(--surface); font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); padding: 8px 8px 3px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
  .dl-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; color: var(--ink); background: none; border: 0; border-radius: 7px; padding: 6px 9px; cursor: pointer; }
  .dl-item:hover { background: var(--surface-2); }
  .dl-item.on { background: var(--teal); color: var(--surface); }
  .dl-item mark { background: var(--amber-soft); color: inherit; border-radius: 3px; }

<script>
(function () {

  document.documentElement.classList.add("fs-" + state.fs);

  /* ---------------- helpers ---------------- */

  /* ---------------- dictionary terms in text ---------------- */
  function termSlug(t) { return t.replace(/[`*]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  var TERM_STOP = { client: 1, host: 1, transport: 1, terminal: 1, precision: 1, recall: 1, tool: 1 };
  var TERMS = (function () {
    var map = {}, list = [];
    DATA.dictionary.forEach(function (e) {
      var base = e.term.replace(/[`*]/g, "");

  var AI_CONTEXT = /\b(AI|LLMs?|models?|language|Claude|ChatGPT|Gemini|Copilot|Ollama|chat|prompts?|tokens?|weights|neural|network|training|trained|agents?|subagents?|CLAUDE\.md|SKILL\.md|\.claude|hooks?|workflow|recipe|answers?|generat\w*|provider|account|GPU|RAM|decoding|sampling|temperature)\b/i;

    "projects": { need: /(ChatGPT|Claude|Gemini)[^.]{0,60}Projects?|Projects?[^.]{0,60}(ChatGPT|Claude|Gemini)/, caseSensitive: true },
    "gems": { need: /Gemini|Gems?\b/ , caseSensitive: true },
    "training": { need: AI_CONTEXT, not: /training (within|for|course|session|our lab)|lab training|safety training/i },
    "skill": { need: /(CLAUDE\.md|SKILL\.md|\.claude|hooks?|subagents?|agents?|workflow|recipe|deg-report|prompt templates?|Claude Code|invoke|loaded|package)/i, not: /(real|well-studied|separate|mix of|over-reliance|soft|lab) skills?|skills? (and over-reliance|&)/i },
    "parameters": { need: /\b(models?|weights|billion|\d+B\b|training|network|LLMs?)\b/i, not: /(migration|kinetic|chunking|code|analysis|docstring|README|a few) parameters/i },
    "weights": { need: AI_CONTEXT },
    "token": { need: AI_CONTEXT, not: /(secret|password|credential|api key|keys?\b|\.env|traceback|shell history|auth|access token)/i },
    "prompts": { not: /permission prompts?/i },
    "prompt": { not: /permission prompt|command prompt/i },
    "model": { not: /(kinetic|agent-based|migration|mouse|animal|disease|data|statistical|linear|mixed) models?|models? (system|organism)|imaging and models|the model for your|role model/i },
    "agent": { not: /agent-based|reducing agent|chemical agent|travel agent/i },
    "repository": { not: /(public|data|sequence) repositor/i },
    "inference": { need: AI_CONTEXT, not: /statistical inference|causal inference/i },
    "sampling": { need: AI_CONTEXT, not: /(sample|blood|tissue|random) sampling/i },
    "temperature": { need: AI_CONTEXT, not: /(incubation|room|body|storage) temperature|°C/i },
    "baseline": { not: /baseline (expression|levels?|measurement)/i },
    "embedding": { not: /(tissue|paraffin) embedding/i },
    "attention": { need: /\b(models?|LLMs?|transformers?|tokens?|words?|layers?|AlphaFold|amino acids?|neural|self-attention|multi-head|Attention Is All You Need)\b/i,
                   not: /(pay|paying|paid|draw|drawing|caught|catch|deserves?|more|special|close|careful|your|our) attention|attention (to|span|for)/i }
  };
  function termAllowed(alias, word, text, start, end, blockText) {

    var rule = TERM_RULES[key] || TERM_RULES[key.replace(/s$/, "")];

    if (rule.caseSensitive && word.charAt(0) !== word.charAt(0).toUpperCase()) return false;
    var near = text.slice(Math.max(0, start - 40), Math.min(text.length, end + 40));

  }

  function linkTerms(root) {

        if (!termAllowed(info.alias, fullWord, text, start, start + fullWord.length, job.block)) continue;

  document.addEventListener("click", function (ev) {

  function renderMd(md, basePath, noLink) {
    var box = el("div", { class: "prose" });
    if (window.marked) {

    advice.innerHTML = "<h3>One last piece of advice: use the smallest tool that does the job</h3>" +
      "<p>You can now use AI for almost anything, and that is exactly the risk. Once a chatbot is open in a tab, every problem starts to look like a prompt. But many of the jobs in our lab don't need a language model at all, and some get worse with one: slower, more expensive, harder to check, and a little different every time you run them. So before you reach for AI, ask yourself three questions. They take ten seconds, and they will save you hours.</p>" +
      "<h4>Do I want help, or do I want automation?</h4>" +
      "<p>Help means you stay in the loop. You're drafting a methods paragraph, trying to understand an error message, or looking for the gaps in an experimental plan, and you read and judge every answer. That's where a chat AI shines, and where its occasional mistakes are caught, because you are right there. Automation means something runs without you, every time, often while you're not looking. Then the AI part should be as small as possible, because nobody is there to catch it when it's wrong. And a lot of automation doesn't need AI at all. A new file from the mass spectrometer landing in a folder is an event, not a question: a few lines of code that watch the folder (a <em>file watcher</em>) or a scheduled task can notice it and start the pipeline. That code never gets tired, costs nothing to run and does the same thing every time.</p>" +
      "<h4>Is this a one-time job, or will it come back?</h4>" +
      "<p>A question you ask once is perfect for a chat. A question you ask every week deserves a script. Let the AI help you write that Python or R script once, check it and put it in git, and from then on just run it. If most cases look the same and a few are odd, split the work: let the script handle the ninety-five percent that follow the pattern, and only send the exceptions (the file with an unexpected column, the free-text comment nobody can parse) to a generative model, with a person looking at what it did. That's the <em>script with one AI step</em> from Module 5: predictable where it can be, flexible only where it has to be.</p>" +
      "<h4>Do I need something new, or a label on something that exists?</h4>" +
      "<p>Remember the two flavours from Module 1. Generative AI makes something new: a summary, a draft, a piece of code. Predictive AI puts a label or a number on something: is this sample an outlier, which cell type is this, will this run fail. For labels and numbers, a predictive model, or even a plain rule like a threshold, is usually the better choice. It's faster and cheaper, it gives the same answer tomorrow, and you can measure how often it's right. A generative model can do it too, but you'd be paying for creativity in a task where you want none.</p>" +
      "<p>Put together, it's a ladder: a rule, then a script, then a predictive model, then generative AI. Start at the bottom and only climb when the rung you're on can't do the job. Each step up buys flexibility and costs reproducibility, money and the ease of checking the result. The best setups often use several rungs at once. A new lipidomics batch arrives, a file watcher starts the QC script, a trained model flags the odd samples, and a generative AI drafts a short note about just those samples, which you read before anything goes further. Every tool does the part it's best at, and the clever one is saved for the cases that need it.</p>" +
      "<p>So the habit to take home isn't “use AI more”. It's “choose on purpose”: help or automation, once or always, new or a label. Ask those three questions, and you'll use AI where it helps and leave it out where it doesn't.</p>";

      "<p>Then pass it on. Run a module as a group session for colleagues who haven't started yet, share a prompt, skill or subagent that worked for you as a pull request, and add the words you missed to the Dictionary. And because AI changes monthly, come back now and then: the <a href=\"#res.timeline\">Timeline</a> and the <a href=\"#res.about\">About</a> page show what has moved on.</p>" +

    figCache[key] = out;
    return out;
  }
  function themeFigures() {
    var dark = currentTheme() === "dark";
    document.querySelectorAll('img[src^="data:image/svg+xml;base64,"], img[data-light]').forEach(function (img) {
      if (!img.dataset.light) img.dataset.light = img.getAttribute("src");
      var want = themedFig(img.dataset.light, dark);
      if (img.getAttribute("src") !== want) img.setAttribute("src", want);
    });
  }
  if (window.matchMedia) { try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { applyModTheme(curMod); themeFigures(); }); } catch (e) {} }
  var THEME_KEY = "ai-omics-theme";
  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paintThemeBtn() {
    var b = document.getElementById("theme-btn");
    if (!b) return;
    b.textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode";
  }
  try { var savedTheme = localStorage.getItem(THEME_KEY); if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme); } catch (e) { /* ignore */ }
  paintThemeBtn();
  function toggleTheme() {
    var next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
    paintThemeBtn(); applyModTheme(curMod); themeFigures();
  }

  /* ---------------- problem reports (kept in this browser, exported by hand) ---------------- */
  var BUG_KEY = "ai-omics-course-bugs-v1";
  function loadBugs() { try { return JSON.parse(localStorage.getItem(BUG_KEY) || "[]"); } catch (e) { return []; } }
  function saveBugs(list) { try { localStorage.setItem(BUG_KEY, JSON.stringify(list)); return true; } catch (e) { return false; } }
  function pageName() {
    if (!location.hash || location.hash === "#start") return "Dashboard (#start)";
    var h = document.querySelector("main h2, main h1");
    return (h ? h.textContent.trim() : "Dashboard") + " (" + (location.hash || "#start") + ")";
  }
  function bugsAsText(list) {
    var lines = ["Decoding AI: problem reports (" + list.length + "), exported " + new Date().toISOString().slice(0, 10), "Content version: v" + DATA.version + " (built " + DATA.built + ")", ""];
    list.forEach(function (b, i) {
      lines.push((i + 1) + ". [" + b.type + "] " + b.when);
      lines.push("   Page: " + b.page);
      lines.push("   " + b.text.replace(/\n/g, "\n   "));
      lines.push("");
    });
    return lines.join("\n");
  }
  function openBugs() {
    var dlg = document.getElementById("bugdlg");
    var where = pageName();
    dlg.textContent = "";
    var type = el("select", null, ["Something is wrong in the content", "Typo or unclear text", "Something doesn't work", "Idea or suggestion"].map(function (t) { return el("option", { text: t }); }));
    var text = el("textarea", { placeholder: "What did you notice? The more specific, the easier to fix.", "aria-label": "Describe the problem" });
    var status = el("span", { role: "status", "aria-live": "polite", class: "muted", style: "font-size:13px;margin-right:auto" });
    var list = el("ul", { class: "bugs" });
    function paint() {
      var bugs = loadBugs();
      list.textContent = "";
      countLine.textContent = bugs.length ? "Your reports so far (" + bugs.length + "):" : "No reports saved yet.";
      bugs.forEach(function (b, i) {
        var del = el("button", { type: "button", title: "Delete this report", "aria-label": "Delete report " + (i + 1), text: "\u00D7" });
        del.addEventListener("click", function () { var all = loadBugs(); all.splice(i, 1); saveBugs(all); paint(); });
        list.appendChild(el("li", null, [el("div", null, [el("small", { text: b.type + " \u00B7 " + b.when + " \u00B7 " + b.page }), el("span", { text: b.text })]), del]));
      });
      exportRow.hidden = !bugs.length;
    }
    var save = el("button", { class: "btn primary", type: "button", text: "Save report" });
    save.addEventListener("click", function () {
      if (!text.value.trim()) { status.textContent = "Write a few words first."; text.focus(); return; }
      var all = loadBugs();
      all.push({ when: new Date().toISOString().slice(0, 16).replace("T", " "), page: where, type: type.value, text: text.value.trim() });
      status.textContent = saveBugs(all) ? "Saved. Thank you!" : "Couldn't save in this browser; copy your text instead.";
      text.value = ""; paint();
    });
    var close = el("button", { class: "btn", type: "button", text: "Close" });
    close.addEventListener("click", function () { dlg.close(); });
    var copyAll = el("button", { class: "btn", type: "button", text: "Copy all" });
    copyAll.addEventListener("click", function () {
      var t = bugsAsText(loadBugs());
      try { navigator.clipboard.writeText(t).then(function () { status.textContent = "Copied. Paste it into an email or chat."; }, function () { status.textContent = "Copy didn't work; use Download instead."; }); }
      catch (e) { status.textContent = "Copy didn't work; use Download instead."; }
    });
    var download = el("button", { class: "btn", type: "button", text: "Download (.txt)" });
    download.addEventListener("click", function () {
      var blob = new Blob([bugsAsText(loadBugs())], { type: "text/plain" });
      saveFile("course-problem-reports-" + new Date().toISOString().slice(0, 10) + ".txt", blob);
    });
    var mail = DATA.contact ? el("a", { class: "btn", href: "#", text: "Email" }) : null;
    if (mail) mail.addEventListener("click", function (ev) {
      ev.preventDefault();
      location.href = "mailto:" + DATA.contact + "?subject=" + encodeURIComponent("AI course: problem reports") + "&body=" + encodeURIComponent(bugsAsText(loadBugs()).slice(0, 1800));
    });
    var clear = el("button", { class: "btn danger", type: "button", text: "Clear all" });
    var armed = false;
    clear.addEventListener("click", function () {
      if (!armed) { armed = true; clear.textContent = "Click again: sent them already?"; setTimeout(function () { armed = false; clear.textContent = "Clear all"; }, 4000); return; }
      saveBugs([]); paint(); status.textContent = "All reports cleared.";
    });
    var countLine = el("p", { style: "margin:0", text: "" });
    var exportRow = el("div", null, [
      el("p", { class: "muted", style: "margin:4px 0 8px", text: "This page isn't a live website, so reports stay in your browser until you send them. When you have a few, copy or download them and send them to the course organiser." }),
      el("div", { class: "actions" }, [copyAll, download, mail, clear])
    ]);
    dlg.appendChild(el("h2", { id: "bug-title", text: "Report a problem" }));
    dlg.appendChild(el("p", { class: "where", text: "Page: " + where }));
    dlg.appendChild(el("label", null, ["What kind of problem?", type]));
    dlg.appendChild(el("label", null, ["What did you notice?", text]));
    dlg.appendChild(el("div", { class: "actions" }, [status, close, save]));
    dlg.appendChild(el("hr"));
    dlg.appendChild(countLine);
    dlg.appendChild(list);
    dlg.appendChild(exportRow);
    paint();
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    text.focus();
  }

  (function () {
    var holder = document.createElement("div");
    holder.className = "side-net";
    holder.setAttribute("aria-hidden", "true");
    holder.innerHTML = networkSvg(300, 360, 30, 4242, 0, [6, 19]);
    document.getElementById("side").appendChild(holder);
  })();
  document.getElementById("built").textContent = "Version " + DATA.version + ", content built " + DATA.built + ". Progress is stored in this browser only.";

  load();
  render();
})();
</script>
