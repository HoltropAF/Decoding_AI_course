<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-label="Cloud versus local. Cloud: your prompt and files cross from your computer to the provider's servers, where the model runs and retention depends on settings; the answer comes back. Local: the prompt and the model both stay on your laptop, talking over localhost; nothing leaves your computer." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Cloud vs local: what crosses the boundary of your computer</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2b36"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8641d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="240" rx="14" fill="#fbfcfc"/>

  <!-- Cloud panel -->
  <rect x="10" y="10" width="370" height="220" rx="12" fill="#ffffff" stroke="#cfdad8"/>
  <text x="26" y="36" font-size="14" font-weight="600" fill="#1d2b36">Cloud</text>
  <text x="76" y="36" font-size="12" fill="#55676d">Claude, ChatGPT, Gemini</text>

  <rect x="26" y="70" width="120" height="84" rx="8" fill="#e2ecea" stroke="#9fb3b8"/>
  <text x="86" y="104" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">Your laptop</text>
  <text x="86" y="124" font-size="11" fill="#55676d" text-anchor="middle">prompt + files</text>

  <line x1="195" y1="52" x2="195" y2="200" stroke="#55676d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="189" y="214" font-size="10.5" fill="#55676d" text-anchor="end">your side</text>
  <text x="201" y="214" font-size="10.5" fill="#55676d">their side</text>

  <rect x="240" y="70" width="124" height="84" rx="8" fill="#f6e4d2" stroke="#b8641d"/>
  <text x="302" y="100" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">Provider</text>
  <text x="302" y="116" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">servers</text>
  <text x="302" y="136" font-size="11" fill="#55676d" text-anchor="middle">model runs here</text>

  <line x1="148" y1="96" x2="236" y2="96" stroke="#b8641d" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="192" y="88" font-size="11" font-weight="600" fill="#b8641d" text-anchor="middle">data sent</text>
  <line x1="238" y1="130" x2="150" y2="130" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="192" y="146" font-size="11" fill="#55676d" text-anchor="middle">answer</text>

  <text x="302" y="176" font-size="11" fill="#55676d" text-anchor="middle">kept for how long, used</text>
  <text x="302" y="190" font-size="11" fill="#55676d" text-anchor="middle">for training? → settings</text>

  <!-- Local panel -->
  <rect x="400" y="10" width="370" height="220" rx="12" fill="#ffffff" stroke="#cfdad8"/>
  <text x="416" y="36" font-size="14" font-weight="600" fill="#1d2b36">Local</text>
  <text x="462" y="36" font-size="12" fill="#55676d">Ollama, LM Studio</text>

  <rect x="416" y="52" width="338" height="132" rx="10" fill="#d5e7ea" stroke="#0f5b6b"/>
  <text x="430" y="72" font-size="13" font-weight="600" fill="#0f5b6b">Your laptop</text>
  <rect x="436" y="90" width="120" height="70" rx="8" fill="#ffffff" stroke="#8fb2b9"/>
  <text x="496" y="122" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="middle">your prompt</text>
  <text x="496" y="140" font-size="11" fill="#55676d" text-anchor="middle">+ files</text>
  <rect x="614" y="90" width="124" height="70" rx="8" fill="#0f5b6b"/>
  <text x="676" y="122" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">model</text>
  <text x="676" y="140" font-size="11" fill="#d5e7ea" text-anchor="middle">llama3.1:8b</text>
  <line x1="558" y1="114" x2="610" y2="114" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="612" y1="138" x2="560" y2="138" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="585" y="106" font-size="10" fill="#55676d" text-anchor="middle">localhost</text>

  <text x="585" y="210" font-size="13" font-weight="600" fill="#0f5b6b" text-anchor="middle">nothing leaves your computer</text>
</svg>
