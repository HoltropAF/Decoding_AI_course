<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="The model has no memory: on every turn the app resends the system prompt and the whole conversation. The request grows each turn until it reaches the context window limit, after which the oldest turns are dropped or summarised." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Every turn, the whole conversation is sent again</title>
  <rect x="0" y="0" width="760" height="250" rx="14" fill="#fbfcfc"/>

  <!-- context window bracket -->
  <line x1="110" y1="28" x2="630" y2="28" stroke="#0f5b6b" stroke-width="1.5"/>
  <line x1="110" y1="22" x2="110" y2="214" stroke="#0f5b6b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="630" y1="22" x2="630" y2="214" stroke="#0f5b6b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="370" y="20" font-size="12" font-weight="600" fill="#0f5b6b" text-anchor="middle">context window: the most the model can read at once</text>

  <g font-size="11" text-anchor="middle">
    <!-- Turn 1 -->
    <text x="98" y="62" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="end">Turn 1</text>
    <rect x="110" y="46" width="50" height="24" fill="#d5e7ea" stroke="#8fb2b9"/><text x="135" y="62" fill="#1d2b36">system</text>
    <rect x="160" y="46" width="40" height="24" fill="#f6e4d2" stroke="#d9a576"/><text x="180" y="62" fill="#1d2b36">you</text>

    <!-- Turn 2 -->
    <text x="98" y="102" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="end">Turn 2</text>
    <rect x="110" y="86" width="50" height="24" fill="#d5e7ea" stroke="#8fb2b9"/><text x="135" y="102" fill="#1d2b36">system</text>
    <rect x="160" y="86" width="40" height="24" fill="#f6e4d2" stroke="#d9a576"/><text x="180" y="102" fill="#1d2b36">you</text>
    <rect x="200" y="86" width="70" height="24" fill="#e2ecea" stroke="#9fb3b8"/><text x="235" y="102" fill="#1d2b36">AI</text>
    <rect x="270" y="86" width="40" height="24" fill="#f6e4d2" stroke="#d9a576"/><text x="290" y="102" fill="#1d2b36">you</text>

    <!-- Turn 3 -->
    <text x="98" y="142" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="end">Turn 3</text>
    <rect x="110" y="126" width="50" height="24" fill="#d5e7ea" stroke="#8fb2b9"/><text x="135" y="142" fill="#1d2b36">system</text>
    <rect x="160" y="126" width="40" height="24" fill="#f6e4d2" stroke="#d9a576"/><text x="180" y="142" fill="#1d2b36">you</text>
    <rect x="200" y="126" width="70" height="24" fill="#e2ecea" stroke="#9fb3b8"/><text x="235" y="142" fill="#1d2b36">AI</text>
    <rect x="270" y="126" width="40" height="24" fill="#f6e4d2" stroke="#d9a576"/><text x="290" y="142" fill="#1d2b36">you</text>
    <rect x="310" y="126" width="70" height="24" fill="#e2ecea" stroke="#9fb3b8"/><text x="345" y="142" fill="#1d2b36">AI</text>
    <rect x="380" y="126" width="40" height="24" fill="#f6e4d2" stroke="#d9a576"/><text x="400" y="142" fill="#1d2b36">you</text>

    <!-- Turn 20 -->
    <text x="98" y="196" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="end">Turn 20</text>
    <rect x="110" y="180" width="50" height="24" fill="#d5e7ea" stroke="#8fb2b9"/><text x="135" y="196" fill="#1d2b36">system</text>
    <rect x="160" y="180" width="90" height="24" fill="#ffffff" stroke="#55676d" stroke-dasharray="3 3"/><text x="205" y="196" fill="#55676d">summary</text>
    <rect x="250" y="180" width="40" height="24" fill="#f6e4d2" stroke="#d9a576"/><text x="270" y="196" fill="#1d2b36">you</text>
    <rect x="290" y="180" width="70" height="24" fill="#e2ecea" stroke="#9fb3b8"/><text x="325" y="196" fill="#1d2b36">AI</text>
    <rect x="360" y="180" width="40" height="24" fill="#f6e4d2" stroke="#d9a576"/><text x="380" y="196" fill="#1d2b36">you</text>
    <rect x="400" y="180" width="70" height="24" fill="#e2ecea" stroke="#9fb3b8"/><text x="435" y="196" fill="#1d2b36">AI</text>
    <rect x="470" y="180" width="40" height="24" fill="#f6e4d2" stroke="#d9a576"/><text x="490" y="196" fill="#1d2b36">you</text>
    <rect x="510" y="180" width="70" height="24" fill="#e2ecea" stroke="#9fb3b8"/><text x="545" y="196" fill="#1d2b36">AI</text>
    <rect x="580" y="180" width="40" height="24" fill="#f6e4d2" stroke="#d9a576"/><text x="600" y="196" fill="#1d2b36">you</text>
  </g>
  <text x="640" y="190" font-size="11" fill="#b8641d">full: oldest turns</text>
  <text x="640" y="204" font-size="11" fill="#b8641d">dropped/summarised</text>
  <text x="380" y="168" font-size="16" fill="#9fb3b8" text-anchor="middle">⋮</text>

  <text x="20" y="236" font-size="12" fill="#55676d">No memory between turns: the app resends everything, so long chats get slower and blurrier.</text>
</svg>
