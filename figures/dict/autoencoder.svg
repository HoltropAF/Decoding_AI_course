<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="An autoencoder. A sample's measurements are squeezed through a narrow bottleneck and rebuilt. A normal sample, like the ones it was trained on, is rebuilt well. An unusual sample is rebuilt badly in several places, which is how the method flags it." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
