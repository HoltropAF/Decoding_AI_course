<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" aria-label="Context rot, or lost in the middle. A curve shows how often a model uses a key fact correctly, depending on where it sits in a long text: high at the start, low in the middle, high again at the end. So put key instructions at the start, repeat the crucial one at the end, and start fresh chats." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
