<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" aria-label="An embedding map. Texts about dendritic cell migration, such as DC migration, DC trafficking to lymph nodes and CCR7 signalling, lie close together. Texts about lipid extraction lie together in another corner. Similar meanings end up close together, even with different words." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>Embeddings: a map of meaning</title>
<rect x="0" y="0" width="640" height="312" rx="14" fill="#fbfcfc"/>
<rect x="30.0" y="45.0" width="580" height="235" rx="14" fill="#eef3f2" stroke="none" stroke-width="1"/>
<text x="320.0" y="32.0" font-size="12.5" fill="#1d2b36" text-anchor="middle" font-weight="600">Embeddings put texts on a map of meaning: similar meaning, close together</text>
<circle cx="150.0" cy="110.0" r="7" fill="#1d7a8c" stroke="none" stroke-width="1" opacity="1"/>
<text x="162.0" y="114.0" font-size="12" fill="#1d2b36" text-anchor="start" font-weight="400">DC migration</text>
<circle cx="205.0" cy="140.0" r="7" fill="#1d7a8c" stroke="none" stroke-width="1" opacity="1"/>
<text x="217.0" y="144.0" font-size="12" fill="#1d2b36" text-anchor="start" font-weight="400">DC trafficking to lymph nodes</text>
<circle cx="130.0" cy="160.0" r="7" fill="#1d7a8c" stroke="none" stroke-width="1" opacity="1"/>
<text x="142.0" y="164.0" font-size="12" fill="#1d2b36" text-anchor="start" font-weight="400">CCR7 signalling</text>
<circle cx="420.0" cy="188.0" r="7" fill="#b8641d" stroke="none" stroke-width="1" opacity="1"/>
<text x="432.0" y="192.0" font-size="12" fill="#1d2b36" text-anchor="start" font-weight="400">lipid extraction</text>
<circle cx="440.0" cy="218.0" r="7" fill="#b8641d" stroke="none" stroke-width="1" opacity="1"/>
<text x="452.0" y="222.0" font-size="12" fill="#1d2b36" text-anchor="start" font-weight="400">Folch method</text>
<circle cx="420.0" cy="248.0" r="7" fill="#b8641d" stroke="none" stroke-width="1" opacity="1"/>
<text x="432.0" y="252.0" font-size="12" fill="#1d2b36" text-anchor="start" font-weight="400">MTBE extraction</text>
<circle cx="470.0" cy="90.0" r="7" fill="#9fb3b8" stroke="none" stroke-width="1" opacity="1"/>
<text x="482.0" y="94.0" font-size="12" fill="#1d2b36" text-anchor="start" font-weight="400">poster title ideas</text>
<ellipse cx="170" cy="138" rx="125" ry="52" fill="none" stroke="#1d7a8c" stroke-dasharray="4 4"/>
<ellipse cx="478" cy="218" rx="100" ry="50" fill="none" stroke="#b8641d" stroke-dasharray="4 4"/>
<text x="320.0" y="300.0" font-size="11.5" fill="#55676d" text-anchor="middle" font-weight="400">shown in 2 dimensions; real embeddings have hundreds to thousands</text>
</svg>
