<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="A random forest with three small decision trees. Each tree asks questions such as whether the internal standard is below 50 percent, and votes fine or problem. Two trees vote problem and one votes fine, so the majority vote is problem." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
