<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" role="img" aria-label="A support vector machine. Two groups of samples are separated by a line placed so that the gap between the groups is as wide as possible. The few samples closest to the line, the support vectors, decide where it goes." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
