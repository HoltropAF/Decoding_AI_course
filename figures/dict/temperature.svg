<rect x="100.0" y="104.0" width="4.0" height="20" rx="4" fill="#1d7a8c" stroke="none" stroke-width="1"/>
<text x="308.0" y="119.0" font-size="11.5" fill="#55676d" text-anchor="start" font-weight="400">0.02</text>
<text x="90.0" y="153.0" font-size="12.5" fill="#1d2b36" text-anchor="end" font-weight="400">nearest</text>
<rect x="100.0" y="138.0" width="200" height="20" rx="4" fill="#eef3f2" stroke="none" stroke-width="1"/>
<rect x="100.0" y="138.0" width="2" height="20" rx="4" fill="#1d7a8c" stroke="none" stroke-width="1"/>
<text x="308.0" y="153.0" font-size="11.5" fill="#55676d" text-anchor="start" font-weight="400">0.01</text>
<text x="90.0" y="187.0" font-size="12.5" fill="#1d2b36" text-anchor="end" font-weight="400">local</text>
<rect x="100.0" y="172.0" width="200" height="20" rx="4" fill="#eef3f2" stroke="none" stroke-width="1"/>
<rect x="100.0" y="172.0" width="2" height="20" rx="4" fill="#1d7a8c" stroke="none" stroke-width="1"/>
<text x="308.0" y="187.0" font-size="11.5" fill="#55676d" text-anchor="start" font-weight="400">0.00</text>
<text x="90.0" y="221.0" font-size="12.5" fill="#1d2b36" text-anchor="end" font-weight="400">spleen</text>
<rect x="100.0" y="206.0" width="200" height="20" rx="4" fill="#eef3f2" stroke="none" stroke-width="1"/>
<rect x="100.0" y="206.0" width="2" height="20" rx="4" fill="#1d7a8c" stroke="none" stroke-width="1"/>
<text x="308.0" y="221.0" font-size="11.5" fill="#55676d" text-anchor="start" font-weight="400">0.00</text>
<text x="500.0" y="50.0" font-size="13" fill="#1d2b36" text-anchor="middle" font-weight="600">High temperature (1.5)</text>
