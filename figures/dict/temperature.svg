<rect x="440.0" y="70.0" width="200" height="20" rx="4" fill="#eef3f2" stroke="none" stroke-width="1"/>
<rect x="440.0" y="70.0" width="76.0" height="20" rx="4" fill="#0f5b6b" stroke="none" stroke-width="1"/>
<text x="648.0" y="85.0" font-size="11.5" fill="#55676d" text-anchor="start" font-weight="400">0.38</text>
<text x="430.0" y="119.0" font-size="12.5" fill="#1d2b36" text-anchor="end" font-weight="400">draining</text>
<rect x="440.0" y="104.0" width="200" height="20" rx="4" fill="#eef3f2" stroke="none" stroke-width="1"/>
<rect x="440.0" y="104.0" width="42.0" height="20" rx="4" fill="#1d7a8c" stroke="none" stroke-width="1"/>
