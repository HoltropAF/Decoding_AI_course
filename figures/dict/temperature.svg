<text x="430.0" y="187.0" font-size="12.5" fill="#1d2b36" text-anchor="end" font-weight="400">local</text>
<rect x="440.0" y="172.0" width="200" height="20" rx="4" fill="#eef3f2" stroke="none" stroke-width="1"/>
<rect x="440.0" y="172.0" width="26.0" height="20" rx="4" fill="#1d7a8c" stroke="none" stroke-width="1"/>
<text x="648.0" y="187.0" font-size="11.5" fill="#55676d" text-anchor="start" font-weight="400">0.13</text>
<text x="430.0" y="221.0" font-size="12.5" fill="#1d2b36" text-anchor="end" font-weight="400">spleen</text>
<rect x="440.0" y="206.0" width="200" height="20" rx="4" fill="#eef3f2" stroke="none" stroke-width="1"/>
<rect x="440.0" y="206.0" width="22.0" height="20" rx="4" fill="#1d7a8c" stroke="none" stroke-width="1"/>
<text x="648.0" y="221.0" font-size="11.5" fill="#55676d" text-anchor="start" font-weight="400">0.11</text>
<text x="350.0" y="270.0" font-size="12" fill="#55676d" text-anchor="middle" font-weight="400">Next word after “Dendritic cells migrate to the …”</text>
<text x="170.0" y="248.0" font-size="11.5" fill="#55676d" text-anchor="middle" font-weight="400">almost always the same word: focused, repetitive</text>
<text x="510.0" y="248.0" font-size="11.5" fill="#55676d" text-anchor="middle" font-weight="400">other words get a real chance: varied, more errors</text>
