<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 285" role="img" aria-label="Temperature changes how the next word is chosen. At low temperature, 0.2, the most likely word, lymph, gets almost all the probability, so the answer is nearly always the same. At high temperature, 1.5, the probabilities are flatter: draining, nearest, local and spleen also get a real chance." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>Temperature</title>
<rect x="0" y="0" width="700" height="285" rx="14" fill="#fbfcfc"/>
<text x="160.0" y="50.0" font-size="13" fill="#1d2b36" text-anchor="middle" font-weight="600">Low temperature (0.2)</text>
