<text x="247.0" y="79.0" font-size="10.5" fill="#55676d" text-anchor="middle" font-weight="400">0.71</text>
<rect x="305.0" y="50.0" width="95" height="34" rx="7" fill="#ffffff" stroke="#9fb3b8" stroke-width="1"/>
<text x="352.0" y="66.0" font-size="11.5" fill="#1d2b36" text-anchor="middle" font-weight="400">draining</text>
<text x="352.0" y="79.0" font-size="10.5" fill="#55676d" text-anchor="middle" font-weight="400">0.12</text>
<rect x="410.0" y="50.0" width="95" height="34" rx="7" fill="#ffffff" stroke="#9fb3b8" stroke-width="1"/>
<text x="457.0" y="66.0" font-size="11.5" fill="#1d2b36" text-anchor="middle" font-weight="400">nearest</text>
<text x="457.0" y="79.0" font-size="10.5" fill="#55676d" text-anchor="middle" font-weight="400">0.06</text>
<text x="40.0" y="72.0" font-size="11.5" fill="#55676d" text-anchor="start" font-weight="400">next-token</text>
<text x="40.0" y="86.0" font-size="11.5" fill="#55676d" text-anchor="start" font-weight="400">probabilities</text>
<text x="40.0" y="280.0" font-size="11.5" fill="#55676d" text-anchor="start" font-weight="400">tokens in</text>
</svg>
