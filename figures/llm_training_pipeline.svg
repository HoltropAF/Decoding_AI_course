<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" role="img" aria-label="How an LLM is made: lots of text is used in pretraining, where the model learns to predict the next token, giving a base model that continues any text. Post-training with instruction tuning and preference training (RLHF) turns it into an assistant model that follows instructions." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>From text to assistant: pretraining, then post-training</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2b36"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="190" rx="14" fill="#fbfcfc"/>

  <rect x="10" y="40" width="160" height="96" rx="10" fill="#eef3f2" stroke="#9fb3b8"/>
  <text x="90" y="72" font-size="14" font-weight="600" fill="#1d2b36" text-anchor="middle">Lots of text</text>
  <text x="90" y="94" font-size="12" fill="#55676d" text-anchor="middle">web, books, code,</text>
  <text x="90" y="110" font-size="12" fill="#55676d" text-anchor="middle">scientific papers</text>
  <text x="90" y="126" font-size="12" fill="#55676d" text-anchor="middle">trillions of tokens</text>

  <line x1="172" y1="88" x2="326" y2="88" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="249" y="78" font-size="12" font-weight="600" fill="#0f5b6b" text-anchor="middle">Pretraining</text>
  <text x="249" y="106" font-size="11" fill="#55676d" text-anchor="middle">learn to predict</text>
  <text x="249" y="120" font-size="11" fill="#55676d" text-anchor="middle">the next token</text>

  <rect x="330" y="40" width="160" height="96" rx="10" fill="#d5e7ea" stroke="#8fb2b9"/>
  <text x="410" y="72" font-size="14" font-weight="600" fill="#1d2b36" text-anchor="middle">Base model</text>
  <text x="410" y="94" font-size="12" fill="#55676d" text-anchor="middle">continues any text</text>
  <text x="410" y="110" font-size="12" fill="#55676d" text-anchor="middle">knows a lot,</text>
  <text x="410" y="126" font-size="12" fill="#55676d" text-anchor="middle">not yet helpful</text>

  <line x1="492" y1="88" x2="646" y2="88" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="569" y="78" font-size="12" font-weight="600" fill="#0f5b6b" text-anchor="middle">Post-training</text>
  <text x="569" y="106" font-size="11" fill="#55676d" text-anchor="middle">instruction tuning +</text>
  <text x="569" y="120" font-size="11" fill="#55676d" text-anchor="middle">preference (RLHF)</text>

  <rect x="650" y="40" width="160" height="96" rx="10" fill="#0f5b6b"/>
  <text x="730" y="72" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Assistant model</text>
  <text x="730" y="94" font-size="12" fill="#d5e7ea" text-anchor="middle">follows instructions</text>
  <text x="730" y="110" font-size="12" fill="#d5e7ea" text-anchor="middle">what you chat with</text>

  <text x="249" y="166" font-size="11" fill="#55676d" text-anchor="middle">weeks–months, thousands of chips</text>
  <text x="569" y="166" font-size="11" fill="#55676d" text-anchor="middle">shapes tone, helpfulness, refusals</text>
  <text x="730" y="166" font-size="11" fill="#b8641d" text-anchor="middle">you only do inference</text>
</svg>
