<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="MCP architecture: the model only requests tool calls; the host application such as Claude Code acts as MCP client and applies permission rules; it talks JSON-RPC to MCP servers (read-only filesystem, pathway lookup, lab metadata API), which read documentation folders, the Reactome API and the lab database. Raw data is outside the read-only zone and not mounted." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>MCP: model, host, servers, data, and the read-only zone</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2b36"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="280" rx="14" fill="#fbfcfc"/>

  <!-- read-only zone -->
  <rect x="440" y="16" width="348" height="196" rx="12" fill="#eef6f7" stroke="#0f5b6b" stroke-dasharray="6 4"/>
  <text x="776" y="34" font-size="11" font-weight="600" fill="#0f5b6b" text-anchor="end">read-only zone</text>

  <!-- model -->
  <rect x="16" y="90" width="110" height="70" rx="10" fill="#0f5b6b"/>
  <text x="71" y="122" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Model</text>
  <text x="71" y="140" font-size="11" fill="#d5e7ea" text-anchor="middle">only asks</text>

  <!-- host -->
  <rect x="190" y="70" width="170" height="110" rx="10" fill="#e2ecea" stroke="#9fb3b8"/>
  <text x="275" y="100" font-size="14" font-weight="600" fill="#1d2b36" text-anchor="middle">Host / MCP client</text>
  <text x="275" y="120" font-size="12" fill="#55676d" text-anchor="middle">Claude Code,</text>
  <text x="275" y="136" font-size="12" fill="#55676d" text-anchor="middle">your own agent</text>
  <rect x="210" y="148" width="130" height="22" rx="5" fill="#cfe3d6" stroke="#8bb89a"/>
  <text x="275" y="163" font-size="11" fill="#1d2b36" text-anchor="middle">permission rules</text>

  <line x1="128" y1="112" x2="186" y2="112" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="188" y1="140" x2="130" y2="140" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="157" y="104" font-size="10.5" fill="#55676d" text-anchor="middle">call</text>
  <text x="157" y="156" font-size="10.5" fill="#55676d" text-anchor="middle">result</text>

  <!-- servers -->
  <g font-size="12" text-anchor="middle">
    <rect x="456" y="46" width="150" height="44" rx="8" fill="#ffffff" stroke="#8fb2b9"/>
    <text x="531" y="66" font-weight="600" fill="#1d2b36">filesystem</text>
    <text x="531" y="81" font-size="10.5" fill="#55676d">mounted read-only</text>
    <rect x="456" y="104" width="150" height="44" rx="8" fill="#ffffff" stroke="#8fb2b9"/>
    <text x="531" y="124" font-weight="600" fill="#1d2b36">pathway lookup</text>
    <text x="531" y="139" font-size="10.5" fill="#55676d">GET requests only</text>
    <rect x="456" y="162" width="150" height="44" rx="8" fill="#ffffff" stroke="#8fb2b9"/>
    <text x="531" y="182" font-weight="600" fill="#1d2b36">lab metadata API</text>
    <text x="531" y="197" font-size="10.5" fill="#55676d">read-only token</text>
  </g>
  <text x="531" y="230" font-size="11" font-weight="600" fill="#1d2b36" text-anchor="middle">MCP servers</text>

  <path d="M 362 110 L 400 110 L 400 68 L 452 68" fill="none" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="362" y1="126" x2="452" y2="126" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 362 142 L 400 142 L 400 184 L 452 184" fill="none" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="160" font-size="10" fill="#55676d">JSON-RPC</text>

  <!-- data -->
  <g font-size="12" text-anchor="middle">
    <rect x="660" y="46" width="116" height="44" rx="8" fill="#efe9f4" stroke="#b9a7cc"/>
    <text x="718" y="66" fill="#1d2b36">Processing/</text>
    <text x="718" y="81" font-size="10.5" fill="#55676d">+ documentation</text>
    <rect x="660" y="104" width="116" height="44" rx="8" fill="#efe9f4" stroke="#b9a7cc"/>
    <text x="718" y="131" fill="#1d2b36">Reactome API</text>
    <rect x="660" y="162" width="116" height="44" rx="8" fill="#efe9f4" stroke="#b9a7cc"/>
    <text x="718" y="189" fill="#1d2b36">lab database</text>
  </g>
  <line x1="608" y1="68" x2="656" y2="68" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="608" y1="126" x2="656" y2="126" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="608" y1="184" x2="656" y2="184" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="632" y="60" font-size="10.5" fill="#55676d" text-anchor="middle">read</text>

  <!-- raw data outside -->
  <rect x="660" y="230" width="116" height="36" rx="8" fill="#ffffff" stroke="#b8641d" stroke-dasharray="4 3"/>
  <text x="718" y="246" font-size="12" fill="#b8641d" text-anchor="middle">Data/raw/</text>
  <text x="718" y="260" font-size="10.5" fill="#b8641d" text-anchor="middle">not mounted</text>
</svg>
