<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-label="Generation loop: all tokens so far go into the model, which gives a probability for every possible next token, for example lymph 0.71, draining 0.12, site 0.04, blood 0.03. One token is picked, appended to the text, and the loop repeats until an end token." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How an LLM writes: one token at a time</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2b36"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8641d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="280" rx="14" fill="#fbfcfc"/>

  <!-- token chips -->
  <g font-size="13" fill="#1d2b36">
    <rect x="20" y="20" width="84" height="28" rx="6" fill="#e2ecea" stroke="#9fb3b8"/>
    <text x="62" y="39" text-anchor="middle">Dendritic</text>
    <rect x="110" y="20" width="56" height="28" rx="6" fill="#e2ecea" stroke="#9fb3b8"/>
    <text x="138" y="39" text-anchor="middle">cells</text>
    <rect x="172" y="20" width="72" height="28" rx="6" fill="#e2ecea" stroke="#9fb3b8"/>
    <text x="208" y="39" text-anchor="middle">migrate</text>
    <rect x="250" y="20" width="36" height="28" rx="6" fill="#e2ecea" stroke="#9fb3b8"/>
    <text x="268" y="39" text-anchor="middle">to</text>
    <rect x="292" y="20" width="44" height="28" rx="6" fill="#e2ecea" stroke="#9fb3b8"/>
    <text x="314" y="39" text-anchor="middle">the</text>
    <rect x="342" y="20" width="62" height="28" rx="6" fill="#f6e4d2" stroke="#b8641d"/>
    <text x="373" y="39" text-anchor="middle" font-weight="600" fill="#b8641d">lymph</text>
  </g>
  <text x="414" y="39" font-size="11" fill="#b8641d">← new token</text>

  <!-- into the model -->
  <line x1="130" y1="52" x2="130" y2="106" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="84" font-size="11" fill="#55676d">all tokens so far</text>
  <rect x="20" y="110" width="220" height="74" rx="10" fill="#0f5b6b"/>
  <text x="130" y="140" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Model</text>
  <text x="130" y="160" font-size="12" fill="#d5e7ea" text-anchor="middle">scores every possible</text>
  <text x="130" y="175" font-size="12" fill="#d5e7ea" text-anchor="middle">next token</text>
  <line x1="242" y1="147" x2="292" y2="147" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- probabilities -->
  <text x="300" y="100" font-size="12" font-weight="600" fill="#1d2b36">Probability of the next token</text>
  <g font-size="12" fill="#1d2b36">
    <text x="380" y="127" text-anchor="end" font-weight="600" fill="#b8641d">lymph</text>
    <rect x="390" y="115" width="213" height="16" rx="3" fill="#b8641d"/>
    <text x="611" y="127" font-weight="600" fill="#b8641d">0.71  ← picked</text>
    <text x="380" y="152" text-anchor="end">draining</text>
    <rect x="390" y="140" width="36" height="16" rx="3" fill="#8fb2b9"/>
    <text x="434" y="152" fill="#55676d">0.12</text>
    <text x="380" y="177" text-anchor="end">site</text>
    <rect x="390" y="165" width="12" height="16" rx="3" fill="#8fb2b9"/>
    <text x="410" y="177" fill="#55676d">0.04</text>
    <text x="380" y="202" text-anchor="end">blood</text>
    <rect x="390" y="190" width="9" height="16" rx="3" fill="#8fb2b9"/>
    <text x="407" y="202" fill="#55676d">0.03</text>
    <text x="380" y="227" text-anchor="end" fill="#55676d">…</text>
    <text x="390" y="227" fill="#55676d">~128,000 other tokens share the rest</text>
  </g>

  <!-- loop back -->
  <path d="M 718 123 L 750 123 L 750 34 L 494 34" fill="none" stroke="#b8641d" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="742" y="80" font-size="12" font-weight="600" fill="#b8641d" text-anchor="end">append</text>
  <text x="742" y="96" font-size="12" font-weight="600" fill="#b8641d" text-anchor="end">&amp; repeat</text>

  <text x="20" y="262" font-size="12" fill="#55676d">Repeats until the model produces an end token. That is why answers stream in word by word.</text>
</svg>
