<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-label="Subagents keep your context clean: the main session sends a self-contained task to the Themis subagent, which starts with a fresh context holding only its fixed instructions, does about 200 file reads and searches with read-only tools, and returns only a one-page report. Its working context is then discarded." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Subagents: the noisy work stays in their context</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2b36"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="280" rx="14" fill="#fbfcfc"/>

  <!-- main session -->
  <rect x="20" y="30" width="280" height="200" rx="12" fill="#ffffff" stroke="#9fb3b8"/>
  <text x="36" y="52" font-size="13" font-weight="600" fill="#1d2b36">Your main session</text>
  <rect x="36" y="64" width="248" height="40" rx="6" fill="#e2ecea"/>
  <text x="160" y="89" font-size="12" fill="#1d2b36" text-anchor="middle">your conversation</text>
  <rect x="36" y="112" width="248" height="28" rx="6" fill="#d5e7ea"/>
  <text x="160" y="131" font-size="12" fill="#1d2b36" text-anchor="middle">"audit this project"</text>
  <text x="160" y="166" font-size="11" fill="#55676d" text-anchor="middle">(still plenty of room)</text>
  <rect x="36" y="186" width="248" height="30" rx="6" fill="#f6e4d2" stroke="#b8641d"/>
  <text x="160" y="206" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="middle">Themis report · 1 page</text>

  <!-- subagent -->
  <rect x="480" y="30" width="280" height="200" rx="12" fill="#ffffff" stroke="#0f5b6b"/>
  <text x="496" y="52" font-size="13" font-weight="600" fill="#0f5b6b">Themis subagent · fresh context</text>
  <rect x="496" y="64" width="248" height="28" rx="6" fill="#cfe3d6" stroke="#8bb89a"/>
  <text x="620" y="83" font-size="12" fill="#1d2b36" text-anchor="middle">fixed instructions (themis.md)</text>
  <g fill="#c3dde2">
    <rect x="496" y="102" width="248" height="6" rx="2"/>
    <rect x="496" y="112" width="210" height="6" rx="2"/>
    <rect x="496" y="122" width="236" height="6" rx="2"/>
    <rect x="496" y="132" width="190" height="6" rx="2"/>
    <rect x="496" y="142" width="248" height="6" rx="2"/>
    <rect x="496" y="152" width="222" height="6" rx="2"/>
    <rect x="496" y="162" width="200" height="6" rx="2"/>
    <rect x="496" y="172" width="244" height="6" rx="2"/>
    <rect x="496" y="182" width="216" height="6" rx="2"/>
    <rect x="496" y="192" width="238" height="6" rx="2"/>
    <rect x="496" y="202" width="206" height="6" rx="2"/>
    <rect x="496" y="212" width="230" height="6" rx="2"/>
  </g>
  <rect x="540" y="146" width="160" height="22" rx="5" fill="#efe9f4" stroke="#b9a7cc"/>
  <text x="620" y="161" font-size="11.5" fill="#1d2b36" text-anchor="middle">≈ 200 file reads &amp; searches</text>

  <!-- arrows -->
  <line x1="302" y1="126" x2="476" y2="126" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="389" y="116" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="middle">task</text>
  <text x="389" y="142" font-size="10.5" fill="#55676d" text-anchor="middle">must be self-contained</text>
  <line x1="476" y1="201" x2="306" y2="201" stroke="#b8641d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="389" y="192" font-size="12" font-weight="600" fill="#b8641d" text-anchor="middle">report only</text>

  <text x="620" y="252" font-size="11" fill="#55676d" text-anchor="middle">tools: Read · Grep · Glob (look, don't touch)</text>
  <text x="620" y="268" font-size="11" fill="#55676d" text-anchor="middle">working context discarded afterwards</text>
  <text x="160" y="252" font-size="11" fill="#55676d" text-anchor="middle">gets the conclusion, not the noise</text>
</svg>
