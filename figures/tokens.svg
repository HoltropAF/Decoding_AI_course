<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 396" role="img" aria-label="How text is cut into tokens, using GPT-4's tokeniser. The sentence Dendritic cells migrate to the lymph node becomes 10 tokens: D, end, ritic, cells, migrate, to, the, lymph, node, and the full stop. The lipid name Cer d18:1/16:0 becomes 10 tokens, almost one per character. The gene ID ENSG00000111640 becomes 6 tokens. Each token has an ID number, which is turned into an embedding." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>How text becomes tokens</title>
<rect x="0" y="0" width="1000" height="396" rx="14" fill="#fbfcfc"/>
<text x="30" y="54" font-size="13" font-weight="600" fill="#1d2b36">A sentence: 7 words become 10 tokens</text>
<rect x="30" y="70" width="34" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="47.0" y="92" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">D</text>
<text x="47.0" y="120" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">35</text>
<rect x="70" y="70" width="51" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="95.5" y="92" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">end</text>
<text x="95.5" y="120" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">408</text>
<rect x="127" y="70" width="73" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="163.5" y="92" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">ritic</text>
<text x="163.5" y="120" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">50308</text>
<rect x="206" y="70" width="84" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="248.0" y="92" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">·cells</text>
<text x="248.0" y="120" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">7917</text>
<rect x="296" y="70" width="106" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="349.0" y="92" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">·migrate</text>
<text x="349.0" y="120" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">45666</text>
<rect x="408" y="70" width="51" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="433.5" y="92" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">·to</text>
<text x="433.5" y="120" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">311</text>
<rect x="465" y="70" width="62" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="496.0" y="92" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">·the</text>
<text x="496.0" y="120" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">279</text>
<rect x="533" y="70" width="84" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="575.0" y="92" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">·lymph</text>
<text x="575.0" y="120" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">43745</text>
<rect x="623" y="70" width="73" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="659.5" y="92" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">·node</text>
<text x="659.5" y="120" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">2494</text>
<rect x="702" y="70" width="34" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="719.0" y="92" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">.</text>
<text x="719.0" y="120" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">13</text>
<text x="30" y="154" font-size="13" font-weight="600" fill="#1d2b36">A lipid name: 1 &#x27;word&#x27; becomes 10 tokens</text>
<rect x="30" y="170" width="34" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="47.0" y="192" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">C</text>
<text x="47.0" y="220" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">34</text>
<rect x="70" y="170" width="40" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="90.0" y="192" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">er</text>
<text x="90.0" y="220" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">261</text>
<rect x="116" y="170" width="40" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="136.0" y="192" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">·d</text>
<text x="136.0" y="220" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">294</text>
<rect x="162" y="170" width="40" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="182.0" y="192" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">18</text>
<text x="182.0" y="220" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">972</text>
<rect x="208" y="170" width="34" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="225.0" y="192" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">:</text>
<text x="225.0" y="220" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">25</text>
<rect x="248" y="170" width="34" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="265.0" y="192" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">1</text>
<text x="265.0" y="220" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">16</text>
<rect x="288" y="170" width="34" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="305.0" y="192" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">/</text>
<text x="305.0" y="220" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">14</text>
<rect x="328" y="170" width="40" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="348.0" y="192" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">16</text>
<text x="348.0" y="220" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">845</text>
<rect x="374" y="170" width="34" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="391.0" y="192" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">:</text>
<text x="391.0" y="220" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">25</text>
<rect x="414" y="170" width="34" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="431.0" y="192" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">0</text>
<text x="431.0" y="220" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">15</text>
<text x="30" y="254" font-size="13" font-weight="600" fill="#1d2b36">A gene ID becomes 6 tokens</text>
<rect x="30" y="270" width="40" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="50.0" y="292" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">EN</text>
<text x="50.0" y="320" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">965</text>
<rect x="76" y="270" width="40" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="96.0" y="292" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">SG</text>
<text x="96.0" y="320" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">7939</text>
<rect x="122" y="270" width="51" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="147.5" y="292" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">000</text>
<text x="147.5" y="320" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">931</text>
<rect x="179" y="270" width="51" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="204.5" y="292" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">001</text>
<text x="204.5" y="320" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">4119</text>
<rect x="236" y="270" width="51" height="34" rx="7" fill="#d5e7ea" stroke="#1d7a8c"/>
<text x="261.5" y="292" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">116</text>
<text x="261.5" y="320" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">8027</text>
<rect x="293" y="270" width="40" height="34" rx="7" fill="#f6e4d2" stroke="#b8641d"/>
<text x="313.0" y="292" font-size="15" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#1d2b36">40</text>
<text x="313.0" y="320" font-size="10.5" font-family="IBM Plex Mono, Consolas, monospace" text-anchor="middle" fill="#55676d">1272</text>
<text x="30" y="356" font-size="12.5" fill="#55676d">Coloured blocks are tokens (· marks a space); the small number under each is its ID in the vocabulary.</text>
<text x="30" y="376" font-size="12.5" fill="#55676d">Each ID is then turned into a long list of numbers (an embedding), and the model only ever works with those.</text>
</svg>
