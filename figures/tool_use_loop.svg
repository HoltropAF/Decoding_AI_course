<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 230" role="img" aria-label="Tool use: the model outputs a structured request such as search_pubmed; the app runs the search with the tool; the results come back to the app, which adds them to the model's context; the model then answers using the results. The model only asks; the app does." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Tool use: the model asks, the app does</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2b36"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="790" height="230" rx="14" fill="#fbfcfc"/>

  <rect x="20" y="60" width="150" height="110" rx="10" fill="#0f5b6b"/>
  <text x="95" y="100" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Model</text>
  <text x="95" y="122" font-size="12" fill="#d5e7ea" text-anchor="middle">decides a tool</text>
  <text x="95" y="138" font-size="12" fill="#d5e7ea" text-anchor="middle">would help</text>

  <rect x="320" y="60" width="150" height="110" rx="10" fill="#e2ecea" stroke="#9fb3b8"/>
  <text x="395" y="100" font-size="14" font-weight="600" fill="#1d2b36" text-anchor="middle">App / agent</text>
  <text x="395" y="122" font-size="12" fill="#55676d" text-anchor="middle">runs the tool,</text>
  <text x="395" y="138" font-size="12" fill="#55676d" text-anchor="middle">checks permissions</text>

  <rect x="620" y="60" width="150" height="110" rx="10" fill="#efe9f4" stroke="#b9a7cc"/>
  <text x="695" y="100" font-size="14" font-weight="600" fill="#1d2b36" text-anchor="middle">Tool</text>
  <text x="695" y="122" font-size="12" fill="#55676d" text-anchor="middle">PubMed, files,</text>
  <text x="695" y="138" font-size="12" fill="#55676d" text-anchor="middle">Python, a database</text>

  <!-- request path -->
  <line x1="172" y1="92" x2="316" y2="92" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="244" y="68" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="middle">1. request</text>
  <text x="244" y="84" font-size="11" font-family="IBM Plex Mono, Consolas, monospace" fill="#55676d" text-anchor="middle">search_pubmed(…)</text>
  <line x1="472" y1="92" x2="616" y2="92" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="544" y="84" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="middle">2. runs it</text>

  <!-- result path -->
  <line x1="618" y1="140" x2="474" y2="140" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="544" y="160" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="middle">3. results</text>
  <line x1="318" y1="140" x2="174" y2="140" stroke="#1d2b36" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="244" y="160" font-size="12" font-weight="600" fill="#1d2b36" text-anchor="middle">4. into the context</text>

  <text x="95" y="194" font-size="12" font-weight="600" fill="#0f5b6b" text-anchor="middle">5. answers using them</text>
  <text x="395" y="214" font-size="12" fill="#55676d" text-anchor="middle">The model only asks. The software does, and can refuse.</text>
</svg>
