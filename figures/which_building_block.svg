<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 586" role="img" aria-label="Decision guide: which AI building block do you need? Ask in this order. Do you know the exact steps and must it run the same way every time? Then a script, with one LLM step if needed. Should it apply to almost every task in the project? Then CLAUDE.md. Must it happen every time with no exceptions? Then a hook or permission rule. Does the model need data or a service it cannot see? Then an MCP server, read-only. Is it a recurring workflow you do now and then? Then a skill. Is it a big, noisy job that should run on its own with fewer permissions? Then a subagent. None of these? Just ask in the chat or let the main agent do it. Often you combine several." font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Which building block do you need?</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55676d"/></marker></defs>
  <rect x="0" y="0" width="1000" height="586" rx="14" fill="#fbfcfc"/>
  <rect x="40" y="14" width="520" height="40" rx="10" fill="#0f5b6b"/>
  <text x="300" y="39" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">A task for AI. Ask these questions, in order:</text>
  <line x1="300" y1="54" x2="300" y2="72" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="74" width="520" height="54" rx="10" fill="#d5e7ea" stroke="#0f5b6b"/>
  <text x="300" y="97" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">Do you know the exact steps, and must it run</text>
  <text x="300" y="115" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">the same way every time?</text>
  <line x1="560" y1="101.0" x2="616" y2="101.0" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="95.0" font-size="11" fill="#2f7d4f" text-anchor="middle" font-weight="600">yes</text>
  <rect x="620" y="74" width="340" height="54" rx="10" fill="#ffffff" stroke="#1d7a8c" stroke-width="1.5"/>
  <text x="790" y="97" font-size="14" font-weight="700" fill="#0f5b6b" text-anchor="middle">A script</text>
  <text x="790" y="115" font-size="11.5" fill="#55676d" text-anchor="middle">with one LLM step inside if needed (Module 2)</text>
  <line x1="300" y1="128" x2="300" y2="144" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="141" font-size="11" fill="#b5462f" font-weight="600">no</text>
  <rect x="40" y="146" width="520" height="54" rx="10" fill="#d5e7ea" stroke="#0f5b6b"/>
  <text x="300" y="169" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">Should it apply to almost every task</text>
  <text x="300" y="187" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">in this project?</text>
  <line x1="560" y1="173.0" x2="616" y2="173.0" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="167.0" font-size="11" fill="#2f7d4f" text-anchor="middle" font-weight="600">yes</text>
  <rect x="620" y="146" width="340" height="54" rx="10" fill="#ffffff" stroke="#1d7a8c" stroke-width="1.5"/>
  <text x="790" y="169" font-size="14" font-weight="700" fill="#0f5b6b" text-anchor="middle">CLAUDE.md / AGENTS.md</text>
  <text x="790" y="187" font-size="11.5" fill="#55676d" text-anchor="middle">short project rules, loaded every session (Module 3)</text>
  <line x1="300" y1="200" x2="300" y2="216" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="213" font-size="11" fill="#b5462f" font-weight="600">no</text>
  <rect x="40" y="218" width="520" height="54" rx="10" fill="#d5e7ea" stroke="#0f5b6b"/>
  <text x="300" y="241" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">Must it happen every single time,</text>
  <text x="300" y="259" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">with no exceptions?</text>
  <line x1="560" y1="245.0" x2="616" y2="245.0" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="239.0" font-size="11" fill="#2f7d4f" text-anchor="middle" font-weight="600">yes</text>
  <rect x="620" y="218" width="340" height="54" rx="10" fill="#ffffff" stroke="#1d7a8c" stroke-width="1.5"/>
  <text x="790" y="241" font-size="14" font-weight="700" fill="#0f5b6b" text-anchor="middle">A hook or a permission rule</text>
  <text x="790" y="259" font-size="11.5" fill="#55676d" text-anchor="middle">enforced by the software, not the model (Module 3)</text>
  <line x1="300" y1="272" x2="300" y2="288" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="285" font-size="11" fill="#b5462f" font-weight="600">no</text>
  <rect x="40" y="290" width="520" height="54" rx="10" fill="#d5e7ea" stroke="#0f5b6b"/>
  <text x="300" y="313" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">Does the model need data or a service</text>
  <text x="300" y="331" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">it can't see right now?</text>
  <line x1="560" y1="317.0" x2="616" y2="317.0" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="311.0" font-size="11" fill="#2f7d4f" text-anchor="middle" font-weight="600">yes</text>
  <rect x="620" y="290" width="340" height="54" rx="10" fill="#ffffff" stroke="#1d7a8c" stroke-width="1.5"/>
  <text x="790" y="313" font-size="14" font-weight="700" fill="#0f5b6b" text-anchor="middle">An MCP server</text>
  <text x="790" y="331" font-size="11.5" fill="#55676d" text-anchor="middle">read-only, least privilege (Module 4)</text>
  <line x1="300" y1="344" x2="300" y2="360" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="357" font-size="11" fill="#b5462f" font-weight="600">no</text>
  <rect x="40" y="362" width="520" height="54" rx="10" fill="#d5e7ea" stroke="#0f5b6b"/>
  <text x="300" y="385" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">Is it a recurring workflow</text>
  <text x="300" y="403" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">you do now and then?</text>
  <line x1="560" y1="389.0" x2="616" y2="389.0" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="383.0" font-size="11" fill="#2f7d4f" text-anchor="middle" font-weight="600">yes</text>
  <rect x="620" y="362" width="340" height="54" rx="10" fill="#ffffff" stroke="#1d7a8c" stroke-width="1.5"/>
  <text x="790" y="385" font-size="14" font-weight="700" fill="#0f5b6b" text-anchor="middle">A skill</text>
  <text x="790" y="403" font-size="11.5" fill="#55676d" text-anchor="middle">a named recipe, loaded only when needed (Module 3)</text>
  <line x1="300" y1="416" x2="300" y2="432" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="429" font-size="11" fill="#b5462f" font-weight="600">no</text>
  <rect x="40" y="434" width="520" height="54" rx="10" fill="#d5e7ea" stroke="#0f5b6b"/>
  <text x="300" y="457" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">Is it a big, noisy job that should run on its own,</text>
  <text x="300" y="475" font-size="13" font-weight="600" fill="#1d2b36" text-anchor="middle">with fewer permissions than you?</text>
  <line x1="560" y1="461.0" x2="616" y2="461.0" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="455.0" font-size="11" fill="#2f7d4f" text-anchor="middle" font-weight="600">yes</text>
  <rect x="620" y="434" width="340" height="54" rx="10" fill="#ffffff" stroke="#1d7a8c" stroke-width="1.5"/>
  <text x="790" y="457" font-size="14" font-weight="700" fill="#0f5b6b" text-anchor="middle">A subagent</text>
  <text x="790" y="475" font-size="11.5" fill="#55676d" text-anchor="middle">own memory, own instructions, few tools (Module 5)</text>
  <line x1="300" y1="488" x2="300" y2="504" stroke="#55676d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="501" font-size="11" fill="#b5462f" font-weight="600">no</text>
  <rect x="40" y="506" width="520" height="54" rx="10" fill="#f6e4d2" stroke="#b8641d"/>
  <text x="300" y="529" font-size="13.5" font-weight="700" fill="#1d2b36" text-anchor="middle">None of these? Just ask in the chat,</text>
  <text x="300" y="547" font-size="13.5" font-weight="700" fill="#1d2b36" text-anchor="middle">or let your main agent do it.</text>
  <text x="620" y="524" font-size="12" fill="#55676d">Often you combine several: for example a subagent</text>
  <text x="620" y="541" font-size="12" fill="#55676d">that follows CLAUDE.md, uses a read-only MCP server,</text>
  <text x="620" y="558" font-size="12" fill="#55676d">and is protected by a permission rule.</text>
</svg>
